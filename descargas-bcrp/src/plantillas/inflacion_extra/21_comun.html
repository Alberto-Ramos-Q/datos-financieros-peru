<!-- Extensiones permanentes (20_ a 29_): estilos y ayudante común de paneles alineados en el tiempo.
     No registra secciones. Lo usan 22_meta_hist, 24_costos y 26_poder. -->
<style>
:root { --xp-up: #876baa; --xp-in: #c9ccd2; --xp-dn: #476399; }
:root[data-theme="dark"] { --xp-up: #b39ddb; --xp-in: #747a92; --xp-dn: #3d5aa8; }
.xp-text { margin: 10px 0 0; color: var(--ink2); font-size: 14px; max-width: 80ch; }
.xp-text b { color: var(--ink); }
.xp-edu { margin-top: 12px; }
.xp-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 12px; }
.xp-tiles .tile .val { font-size: 26px; }
.xp-tiles .tile .sub { font-size: 12.5px; }
</style>
<script>
// Paneles con eje de tiempo común, un solo eje vertical por panel, cruz y tooltip compartidos.
// panels: [{box, H, series: [{get(i), label, short, color, dash}], fmt(v) para valores, tick(t) para el eje,
//           rows(i) opcional para el tooltip, aria}]; idx: índices de MONTHS visibles.
window.XP = window.XP || {};
XP.signed = (v, d = 1) => v == null ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
XP.pctTick = t => t === 0 ? '0' : (t < 0 ? '−' : '') + Math.abs(t) + '%';
XP.idxFrom = (arrays, floor) => {
  let a = Infinity, b = -1;
  arrays.filter(Boolean).forEach(arr => {
    const f = arr.findIndex(v => v != null), l = arr.map(v => v != null).lastIndexOf(true);
    if (f >= 0) { a = Math.min(a, f); b = Math.max(b, l); }
  });
  a = Math.max(a, idxOf(range.start), floor ? idxOf(floor) : 0);
  const out = [];
  for (let i = a; i <= b; i++) out.push(i);
  return out;
};
XP.panels = function (panels, idx) {
  const n = idx.length;
  if (n < 2) return;
  const group = {charts: [], cur: null};
  const show = (i, evt, from) => {
    i = Math.max(idx[0], Math.min(idx[n - 1], i)); group.cur = i;
    group.charts.forEach(c => c.mark(i));
    const [cx, cy] = anchorOf(evt, from);
    showTip(cx, cy, mLabel(MONTHS[i]), group.charts.flatMap(c => c.rows(i)));
  };
  const hide = () => { hideTip(); group.charts.forEach(c => c.unmark()); };
  for (const p of panels) {
    const box = p.box;
    box.replaceChildren();
    const W = box.clientWidth;
    if (!W) continue;
    const narrow = W < 600, H = p.H || 170;
    const m = {l: 52, r: narrow ? 12 : 128, t: 10, b: 24}, pw = W - m.l - m.r, ph = H - m.t - m.b;
    const vals = [];
    for (const i of idx) for (const s of p.series) { const v = s.get(i); if (v != null) vals.push(v); }
    if (!vals.length) continue;
    const dom = niceDomain(Math.min(0, ...vals), Math.max(0, ...vals), p.ticks || 4);
    const y = v => m.t + (dom.hi - v) / (dom.hi - dom.lo) * ph;
    const x = i => m.l + (i - idx[0]) * pw / (n - 1);
    const svg = svgEl('svg', {width: W, height: H, role: 'img', 'aria-label': p.aria || ''}, box);
    drawYGrid(svg, dom.ticks, y, m.l, m.l + pw, p.tick || XP.pctTick);
    drawXTicks(svg, timeTicks(idx.map(i => MONTHS[i]), pw), c => x(idx[0] + c), H - 6);
    for (const s of p.series) {
      let d = '', pen = false;
      for (const i of idx) {
        const v = s.get(i);
        if (v == null) { pen = false; continue; }
        d += (pen ? 'L' : 'M') + x(i) + ',' + y(v); pen = true;
      }
      svgEl('path', {d, fill: 'none', stroke: s.color, 'stroke-width': s.w || 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round',
        'stroke-dasharray': s.dash ? '5 4' : 'none'}, svg);
    }
    if (!narrow) {
      const ends = p.series.filter(s => !s.noEnd).map(s => {
        for (let j = n - 1; j >= 0; j--) { const v = s.get(idx[j]); if (v != null) return {s, i: idx[j], v, y: y(v)}; }
        return null;
      }).filter(Boolean).sort((a, b) => a.y - b.y);
      for (let j = 1; j < ends.length; j++) if (ends[j].y - ends[j - 1].y < 15) ends[j].y = ends[j - 1].y + 15;
      for (const e of ends) {
        svgEl('circle', {cx: x(e.i), cy: y(e.v), r: 3.5, fill: e.s.color, stroke: 'var(--surface)', 'stroke-width': 2}, svg);
        const t = svgEl('text', {x: m.l + pw + 10, y: e.y + 4, class: 'dlbl'}, svg);
        const a = svgEl('tspan', {class: 'dval'}, t); a.textContent = (p.fmt || pct)(e.v);
        if (e.s.short) { const b = svgEl('tspan', {}, t); b.textContent = ' ' + e.s.short; }
      }
    }
    const cross = svgEl('line', {y1: m.t, y2: m.t + ph, stroke: 'var(--ink2)', 'stroke-width': 1, visibility: 'hidden'}, svg);
    const dots = p.series.map(s => svgEl('circle', {r: 4, fill: s.color, stroke: 'var(--surface)', 'stroke-width': 2, visibility: 'hidden'}, svg));
    const hit = svgEl('rect', {class: 'hit', x: m.l, y: m.t, width: pw, height: ph, tabindex: 0,
      'aria-label': (p.aria || '') + '; use las flechas para recorrer los meses'}, svg);
    const chart = {
      mark(i) {
        cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('visibility', 'visible');
        p.series.forEach((s, j) => {
          const v = s.get(i);
          dots[j].setAttribute('visibility', v == null ? 'hidden' : 'visible');
          if (v != null) { dots[j].setAttribute('cx', x(i)); dots[j].setAttribute('cy', y(v)); }
        });
      },
      unmark() { cross.setAttribute('visibility', 'hidden'); dots.forEach(c => c.setAttribute('visibility', 'hidden')); },
      rows: i => p.rows ? p.rows(i) : p.series.map(s => ({value: (p.fmt || pct)(s.get(i)), label: s.label, color: s.color})),
    };
    group.charts.push(chart);
    hit.addEventListener('pointermove', evt => { const r = svg.getBoundingClientRect(); show(idx[0] + Math.round((evt.clientX - r.left - m.l) / pw * (n - 1)), evt, cross); });
    hit.addEventListener('pointerleave', hide); hit.addEventListener('blur', hide);
    hit.addEventListener('focus', () => show(group.cur == null ? idx[n - 1] : group.cur, null, cross));
    hit.addEventListener('keydown', e => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault(); show((group.cur == null ? idx[n - 1] : group.cur) + (e.key === 'ArrowRight' ? 1 : -1), null, cross);
    });
  }
};
// Tabla simple en un contenedor: head = [títulos], rows = [[celdas]].
XP.table = function (wrap, head, rows) {
  wrap.replaceChildren();
  const t = htmlEl('table', null, wrap), tr = htmlEl('tr', null, htmlEl('thead', null, t)), tb = htmlEl('tbody', null, t);
  head.forEach(h => htmlEl('th', {text: h, scope: 'col'}, tr));
  rows.forEach(r => { const row = htmlEl('tr', null, tb); r.forEach(c => htmlEl('td', {text: c == null ? '—' : String(c)}, row)); });
};
// Botón «Ver tabla» propio (los del script principal se enlazan antes de montar las extensiones).
XP.toggle = function (btnId, wrapId, fill, labels = ['Ver tabla', 'Ocultar tabla']) {
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('#' + btnId);
    if (!b) return;
    const wrap = document.getElementById(wrapId), open = wrap.hidden;
    if (open) fill();
    wrap.hidden = !open;
    b.textContent = open ? labels[1] : labels[0];
  });
};
// Redibuja una sección cuando cambia el filtro de periodo del tablero (que solo redibuja sus propios gráficos).
XP.followRange = function (sectionId) {
  document.getElementById('range').addEventListener('click', e => {
    if (!e.target.closest('button') || tab !== 'tablero') return;
    const s = EXTRA.sections.find(z => z.id === sectionId);
    if (s && s.render) runSafe(() => s.render(), sectionId);
  });
};
</script>
